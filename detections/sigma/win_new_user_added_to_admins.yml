title: Account Added To Local Administrators Group
id: 9c3e2a41-6d8b-4f57-b0e2-1a7c5d9e3b24
status: experimental
description: |
    Detects a member being added to the built-in local Administrators group (SID S-1-5-32-544).
    Attackers do this to keep privileged access after the first compromise.
references:
    - https://attack.mitre.org/techniques/T1098/
    - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4732
author: Likhith H S
date: 2026-10-24
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4732
        TargetSid: 'S-1-5-32-544'
    condition: selection
falsepositives:
    - Approved administrator changes (check against a change ticket)
level: high
