title: SSH Failed Password Authentication
id: 5b0d8e7a-3f1c-4c6e-9a2d-7e4b1f0c9a11
status: experimental
description: |
    Detects failed SSH password logins on Linux. A burst of these from one source is the
    signature of a brute-force or password-spraying attempt.
references:
    - https://attack.mitre.org/techniques/T1110/001/
author: Likhith H S
date: 2026-10-24
tags:
    - attack.credential-access
    - attack.t1110.001
logsource:
    product: linux
    service: sshd
detection:
    keywords:
        - 'Failed password for'
        - 'authentication failure'
    condition: keywords
falsepositives:
    - Users mistyping their password
    - Monitoring systems with stale credentials
level: medium
