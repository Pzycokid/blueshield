name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  soar-tests:
    name: SOAR tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Smoke test on the sample alerts
        run: python -m soar.cli samples/wazuh_alerts.json samples/suricata_eve.json --out cases

  detections:
    name: Sigma validation + conversion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sigma-cli and backends
        run: pip install sigma-cli pySigma-backend-splunk pySigma-backend-elasticsearch
      - name: Validate rules
        run: sigma check detections/sigma
      - name: Convert to Splunk SPL and Elastic (Lucene)
        run: |
          mkdir -p build
          sigma convert -t splunk --without-pipeline detections/sigma -o build/splunk.spl
          sigma convert -t lucene --without-pipeline detections/sigma -o build/elastic.lucene
      - uses: actions/upload-artifact@v4
        with:
          name: converted-detections
          path: build/
